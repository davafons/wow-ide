name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'
      - name: Install ShellCheck
        run: brew install shellcheck
      - name: Lint and build
        run: make test
